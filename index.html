    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var str = (typeof msg === 'string' ? msg : '') || (error && error.message) || '';
        if (str.indexOf('Script error') !== -1 || str === 'Script error.') {
          return true; // Suppress cross-origin script error
        }
        return false;
      };
      window.addEventListener('error', function(e) {
        if (!e) return;
        var msg = (typeof e === 'string' ? e : e.message) || '';
        if (msg === 'Script error.' || msg === 'Script error' || msg.indexOf('Script error') !== -1) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          if (typeof e.stopPropagation === 'function') e.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (!e) return;
        var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason.indexOf('Script error') !== -1) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          return true;
        }
      });
    </script>
